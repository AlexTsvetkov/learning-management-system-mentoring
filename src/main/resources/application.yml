spring:
  application:
    name: learning-management-system
    version: 0.1.0
  datasource:
    # for db2
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    #      for postgres
  #    url: jdbc:postgresql://localhost:5432/lms_db
  #    username: lms_user
  #    password:
  #    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # for db2
      ddl-auto: none
    #      for postgres
    #      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 13aa81e48ff568
    password: a82e0758f7037f
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics

spring.jpa.open-in-view: false

server:
  port: 8080

app:
  email-executor:
    core-pool-size: 5
    max-pool-size: 20
    queue-capacity: 50
    thread-name-prefix: "email-executor-"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{app.name:-${spring.application.name}}] [%X{app.version:-${spring.application.version}}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.lms.mentoring: DEBUG

---
# Cloud Profile - SAP BTP Cloud Foundry
spring:
  config:
    activate:
      on-profile: cloud
  # Datasource is auto-configured by java-cfenv from VCAP_SERVICES
  # java-cfenv automatically detects hana-cloud service and configures:
  # - spring.datasource.url
  # - spring.datasource.username  
  # - spring.datasource.password
  # - spring.datasource.driver-class-name
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.HANAColumnStoreDialect
        show_sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

# SAP BTP Services Configuration
# These values are populated from VCAP_SERVICES when bound to services
sap:
  # Destination Service Configuration
  destination:
    service:
      name: lms-destination
      # These are populated from VCAP_SERVICES binding
      uri: ${vcap.services.lms-destination.credentials.uri:}
      clientid: ${vcap.services.lms-destination.credentials.clientid:}
      clientsecret: ${vcap.services.lms-destination.credentials.clientsecret:}
      url: ${vcap.services.lms-destination.credentials.url:}
  # Feature Flags Service Configuration
  feature-flags:
    service:
      name: lms-feature-flags
      # These are populated from VCAP_SERVICES binding
      uri: ${vcap.services.lms-feature-flags.credentials.uri:}
      clientid: ${vcap.services.lms-feature-flags.credentials.clientid:}
      clientsecret: ${vcap.services.lms-feature-flags.credentials.clientsecret:}
      url: ${vcap.services.lms-feature-flags.credentials.url:}
  # SMTP Configuration
  smtp:
    # User-provided service name for SMTP credentials
    user-provided-service:
      name: lms-smtp-credentials
    # Destination name for SMTP (when using Destination Service)
    destination:
      name: lms-smtp

# Application Autoscaler Configuration (handled by CF service binding)
# Logging Configuration (handled by CF service binding + logback-spring.xml)

logging:
  level:
    root: INFO
    com.lms.mentoring: INFO
    com.sap.cloud: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

server:
  port: ${PORT:8080}

---
# Dev Profile - Local Development with H2
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.lms.mentoring: DEBUG

---
# Prod Profile - PostgreSQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/lms_db
    username: lms_user
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false

logging:
  level:
    root: INFO
    com.lms.mentoring: INFO