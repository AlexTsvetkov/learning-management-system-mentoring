# GitLab CI/CD Pipeline for Learning Management System
# Spring Boot application with SAP BTP Cloud Foundry deployment
#
# Pipeline stages:
# 1. Build: Compile and package the application
# 2. Test: Run unit tests
# 3. Deploy: Deploy to SAP BTP Cloud Foundry

image: maven:3.9.6-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # Disable interactive mode for Maven
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  # Application artifact name
  ARTIFACT_NAME: "learning-management-system-0.1.0.jar"

# Cache Maven dependencies between pipeline runs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository/
    - target/

stages:
  - build
  - test
  - deploy

# ==================== BUILD STAGE ====================
build:
  stage: build
  script:
    - echo "Building Spring Boot application..."
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
    - echo "Build completed successfully"
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  only:
    - main
    - master
    - develop
    - merge_requests

# ==================== TEST STAGE ====================
test:
  stage: test
  script:
    - echo "Running unit tests..."
    - mvn $MAVEN_CLI_OPTS test
    - echo "Tests completed"
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 1 week
  only:
    - main
    - master
    - develop
    - merge_requests

# ==================== DEPLOY STAGE ====================
# Deploy to SAP BTP Cloud Foundry (dev environment)
deploy-dev:
  stage: deploy
  image: governmentpaas/cf-cli:latest
  before_script:
    - echo "Installing Cloud Foundry CLI..."
  script:
    - echo "Logging into SAP BTP Cloud Foundry..."
    - cf login -a "$CF_API" -u "$CF_USERNAME" -p "$CF_PASSWORD" -o "$CF_ORG" -s "$CF_SPACE"
    - echo "Deploying application to Cloud Foundry..."
    - cf push -f manifest.yaml
    - echo "Deployment completed successfully"
    - cf apps
  environment:
    name: development
    url: https://learning-management-system-1.cfapps.us10-001.hana.ondemand.com
  only:
    - main
    - master
  when: manual
  allow_failure: false

# Deploy to production (with approval)
deploy-prod:
  stage: deploy
  image: governmentpaas/cf-cli:latest
  script:
    - echo "Logging into SAP BTP Cloud Foundry (Production)..."
    - cf login -a "$CF_API_PROD" -u "$CF_USERNAME_PROD" -p "$CF_PASSWORD_PROD" -o "$CF_ORG_PROD" -s "$CF_SPACE_PROD"
    - echo "Deploying application to Production..."
    - cf push -f manifest.yaml
    - echo "Production deployment completed"
    - cf apps
  environment:
    name: production
    url: https://learning-management-system.cfapps.us10-001.hana.ondemand.com
  only:
    - main
    - master
  when: manual
  allow_failure: false
  needs:
    - deploy-dev

# ==================== OPTIONAL JOBS ====================

# Code quality check (optional - runs on merge requests)
code-quality:
  stage: test
  script:
    - echo "Running code quality checks..."
    - mvn $MAVEN_CLI_OPTS verify -DskipTests
  allow_failure: true
  only:
    - merge_requests

# Dependency check (security scan)
dependency-check:
  stage: test
  script:
    - echo "Checking for dependency vulnerabilities..."
    - mvn $MAVEN_CLI_OPTS dependency:tree
  allow_failure: true
  only:
    - main
    - master
    - schedules